name: CI

# Pipeline pre-publicación:
#   1. quality        -> flutter analyze + flutter test + Android lint del módulo :app (siempre)
#   2. build-release  -> AAB release ofuscado (firmado de producción si hay secrets,
#                        si no, con keystore temporal solo para validar el build)
#
# ⚠️ JDK: AGP 9.0.1 exige Gradle >= 9.1.0 y un JDK 17-21. El `gradle.properties`
# del proyecto pinnea `org.gradle.java.home` al JBR local (Windows). En CI se
# sobrescribe ese valor con la ruta del JDK 21 instalado, usando la precedencia
# de `~/.gradle/gradle.properties` sobre la del proyecto.

on:
  push:
    branches: [main, develop, 'release/**']
    # Los tags también disparan: sin esta línea `git push origin vX.Y.Z` no
    # arrancaba nada y el AAB quedaba colgado de un push de rama, no del tag.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyzer, tests y lint Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21 (requerido por AGP 9.0.1)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Sobrescribe el org.gradle.java.home local (JBR de Windows) con el JDK del runner.
      - name: Configurar org.gradle.java.home para CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.home=%s\n' "$JAVA_HOME" > "$HOME/.gradle/gradle.properties"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Preparar google-services.json para Android lint
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "dev.matute.slidingpuzzle"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCiLintValidation0000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Android lint
        working-directory: android
        # chmod como defensa: git desde Windows puede perder el bit de ejecución.
        #
        # `:app:lint` y NO `lint` a secas: el task agregado recorre todos los
        # subproyectos de Gradle, incluidos los plugins de pub-cache, y ahí no
        # podemos hacer nada. `firebase_storage 13.6.0` trae `@Nullable` (la
        # anotación de Java) en código Kotlin y lint lo marca como ERROR
        # [KotlinNullnessAnnotation], así que `:firebase_storage:lintDebug`
        # abortaba el build entero. Su fuente es de solo lectura y `pub get` la
        # regenera: no se arregla ahí ni admite baseline.
        # Lo que se lintea acá es el código propio, que es lo único accionable.
        run: |
          chmod +x gradlew
          ./gradlew :app:lint

  build-release:
    name: Build AAB release
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21 (requerido por AGP 9.0.1)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configurar org.gradle.java.home para CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.home=%s\n' "$JAVA_HOME" > "$HOME/.gradle/gradle.properties"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      # Secrets a configurar en Settings > Secrets and variables > Actions:
      #   ANDROID_KEYSTORE_BASE64     -> el .jks codificado en base64
      #   KEY_STORE_PASSWORD          -> storePassword del keystore
      #   KEY_ALIAS_PASSWORD          -> keyPassword del keystore
      #   KEY_ALIAS                   -> alias de la clave
      #   DART_DEFINES_JSON_BASE64    -> dart_defines.json codificado en base64 (IDs de AdMob, Firebase y Play Games)
      #   GOOGLE_SERVICES_JSON_BASE64 -> android/app/google-services.json codificado en base64
      # Si falta alguno de firma, se genera un keystore temporal para validar el build
      # (el AAB resultante NO sirve para producción).
      - name: Configurar firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEY_STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sliding_puzzle_key.jks
            {
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyPassword=$KEY_ALIAS_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=sliding_puzzle_key.jks"
            } > android/key.properties
            echo "FIRMA=production" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore android/app/sliding_puzzle_key.jks \
              -alias sliding_puzzle -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=CI" >/dev/null 2>&1
            {
              echo "storePassword=android"
              echo "keyPassword=android"
              echo "keyAlias=sliding_puzzle"
              echo "storeFile=sliding_puzzle_key.jks"
            } > android/key.properties
            echo "FIRMA=ci-validation" >> "$GITHUB_ENV"
          fi

      - name: Configurar credenciales secretas (AdMob + Firebase)
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.DART_DEFINES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${DART_DEFINES_JSON_BASE64:-}" ]; then
            echo "$DART_DEFINES_JSON_BASE64" | base64 --decode > dart_defines.json
          else
            cp dart_defines.example.json dart_defines.json
          fi
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "dev.matute.slidingpuzzle"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCiLintValidation0000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Dependencias
        run: flutter pub get

      # Sin estos IDs el AAB compila igual, pero Play Games queda con APP_ID "0"
      # (el popup se cierra solo) y no se envía ningún logro. Falla el build de
      # producción para que un secret desactualizado no pase desapercibido.
      - name: Validar dart_defines (Play Games)
        if: ${{ env.FIRMA == 'production' }}
        run: |
          set -euo pipefail
          for k in PLAY_GAMES_APP_ID ACHIEVEMENT_PRIMER_DESLIZ ACHIEVEMENT_DESAFIO_SUPERADO \
                   ACHIEVEMENT_MENTE_AGIL ACHIEVEMENT_PERFECCIONISTA ACHIEVEMENT_GRAN_MAESTRO; do
            v=$(jq -r --arg k "$k" '.[$k] // ""' dart_defines.json)
            if [ -z "$v" ]; then
              echo "::error::Falta $k en el secret DART_DEFINES_JSON_BASE64"
              exit 1
            fi
          done

      - name: Build AAB release (ofuscado)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define-from-file=dart_defines.json

      - name: Subir AAB firmado de producción
        if: ${{ env.FIRMA == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Subir símbolos de desofuscación
        if: ${{ env.FIRMA == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: warn
